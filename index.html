<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spence.com.au</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1b19" media="(prefers-color-scheme: dark)" />
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/martian-mono/files/martian-mono-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/index.css" />
    <script>
      // Inline and blocking, so a scheme chosen on an earlier visit paints from the first frame rather than after the
      // system's. Storage can be unavailable, as in some private windows, and then the page follows the system.
      try {
        const scheme = localStorage.getItem('scheme');
        if (scheme) document.documentElement.dataset.scheme = scheme;
      } catch {}
    </script>
    <script type="module" src="/src/android.ts"></script>
    <script type="module" src="/src/scheme.ts"></script>
    <script type="module" src="/src/shell.ts"></script>
  </head>
  <body>
    <div id="root"><!--app--></div>
  </body>
</html>
