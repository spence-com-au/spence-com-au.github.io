<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spence.com.au</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f4efe6;
        color: #2b2b2b;
      }
      ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 2rem;
        margin: 0;
        padding: 2rem;
        list-style: none;
      }
      a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        padding: 1.5rem;
        border-radius: 1.5rem;
        color: inherit;
        font-size: 1.25rem;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        background: #fff;
      }
      img {
        width: 8rem;
        height: 8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 hidden>spence.com.au</h1>
      <ul>
        <li>
          <a href="/electronics-kit/"><img src="/electronics-kit/icon.svg" alt="" />Electronics Kit</a>
        </li>
        <li>
          <a href="/dino-park/"><img src="/dino-park/icon.svg" alt="" />Dino Park</a>
        </li>
      </ul>
    </main>
  </body>
</html>
