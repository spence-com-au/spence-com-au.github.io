<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spence.com.au</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f4efe6;
        color: #2b2b2b;
      }
      ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 2rem;
        margin: 0;
        padding: 2rem;
        list-style: none;
      }
      a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        padding: 1.5rem;
        border-radius: 1.5rem;
        color: inherit;
        font-size: 1.25rem;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        background: #fff;
      }
      img {
        width: 8rem;
        height: 8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 hidden>spence.com.au</h1>
      <ul>
        <li>
          <a href="/dino-park/"><img src="/dino-park/icon.svg" alt="" />Dino Park</a>
        </li>
        <li>
          <a href="/electronics-kit/"><img src="/electronics-kit/icon.svg" alt="" />Electronics Kit</a>
        </li>
        <li>
          <a href="/pogo-utils/"><img src="/pogo-utils/icon.svg" alt="" />PoGo Utils</a>
        </li>
      </ul>
    </main>
    <script>
      // Replace the static list above with a link to every public repo in the
      // spence-com-au account. The static list stays as the fallback if the
      // GitHub API can't be reached.
      (async () => {
        const list = document.querySelector('ul');
        // Keep hand-written titles (e.g. "PoGo Utils") for repos already listed.
        const titles = new Map(
          [...list.querySelectorAll('a')].map((a) => [a.pathname.replaceAll('/', ''), a.textContent.trim()]),
        );
        const title = (name) =>
          titles.get(name) ?? name.replace(/[-_]+/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());

        const repos = [];
        try {
          for (let page = 1; ; page++) {
            const res = await fetch(
              `https://api.github.com/users/spence-com-au/repos?type=owner&sort=full_name&per_page=100&page=${page}`,
            );
            if (!res.ok) return;
            const batch = await res.json();
            repos.push(...batch);
            if (batch.length < 100) break;
          }
        } catch {
          return;
        }

        const items = repos
          .filter((repo) => !repo.private && repo.name !== 'spence-com-au.github.io')
          .map((repo) => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            // Repos published with GitHub Pages are served under this domain;
            // link anything else to its page on GitHub.
            a.href = repo.has_pages ? `/${repo.name}/` : repo.html_url;
            if (repo.description) a.title = repo.description;
            const img = document.createElement('img');
            img.src = `/${repo.name}/icon.svg`;
            img.alt = '';
            img.onerror = () => img.remove();
            a.append(img, title(repo.name));
            li.append(a);
            return li;
          });
        if (items.length) list.replaceChildren(...items);
      })();
    </script>
  </body>
</html>
