<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spence.com.au</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f4efe6;
        color: #2b2b2b;
      }
      ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 2rem;
        margin: 0;
        padding: 2rem;
        list-style: none;
      }
      a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        padding: 1.5rem;
        border-radius: 1.5rem;
        color: inherit;
        font-size: 1.25rem;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        background: #fff;
      }
      img {
        width: 8rem;
        height: 8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 hidden>spence.com.au</h1>
      <ul></ul>
    </main>
    <script>
      // Link to every public repo in the spence-com-au account.
      (async () => {
        const list = document.querySelector('ul');
        // Use the <title> of a repo's GitHub Pages site, falling back to a
        // title derived from the repo name (e.g. "dino-park" -> "Dino Park").
        const title = async (repo) => {
          if (repo.has_pages) {
            try {
              const res = await fetch(`/${repo.name}/`);
              if (res.ok) {
                const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
                if (doc.title.trim()) return doc.title.trim();
              }
            } catch {}
          }
          return repo.name.replace(/[-_]+/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
        };

        const repos = [];
        try {
          for (let page = 1; ; page++) {
            const res = await fetch(
              `https://api.github.com/users/spence-com-au/repos?type=owner&sort=full_name&per_page=100&page=${page}`,
            );
            if (!res.ok) return;
            const batch = await res.json();
            repos.push(...batch);
            if (batch.length < 100) break;
          }
        } catch {
          return;
        }

        const items = await Promise.all(
          repos
            .filter((repo) => !repo.private && repo.name !== 'spence-com-au.github.io')
            .map(async (repo) => {
              const li = document.createElement('li');
              const a = document.createElement('a');
              // Repos published with GitHub Pages are served under this domain;
              // link anything else to its page on GitHub.
              a.href = repo.has_pages ? `/${repo.name}/` : repo.html_url;
              if (repo.description) a.title = repo.description;
              const img = document.createElement('img');
              img.src = `/${repo.name}/icon.svg`;
              img.alt = '';
              img.onerror = () => img.remove();
              a.append(img, await title(repo));
              li.append(a);
              return li;
            }),
        );
        list.append(...items);
      })();
    </script>
  </body>
</html>
