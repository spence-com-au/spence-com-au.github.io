---
version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'

    # `@types/node` describes one Node major version, so it follows `devEngines.runtime.version` in `package.json`
    # rather than the newest release: a later major types APIs the runtime lacks, and CI passes regardless.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
