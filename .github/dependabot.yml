---
version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'

    # pnpm 12 refuses a release younger than its default `minimumReleaseAge` of a day, so CI's `pnpm install` would fail
    # on any update Dependabot proposes sooner than that.
    cooldown:
      default-days: 1
