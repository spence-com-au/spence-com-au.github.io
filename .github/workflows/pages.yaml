---
name: 'Pages'

on:
  pull_request: {}
  push:
    branches: ['master']

  # Pick up new repos daily; run manually from the Actions tab to update sooner.
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: 'read'

concurrency:
  group: 'pages-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  build:
    name: 'Build'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'pnpm/setup@v3'
        with:
          cache: true

      - run: 'pnpm build'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      - uses: 'actions/upload-pages-artifact@v5'
        with:
          path: '_site'

  deploy:
    name: 'Deploy'
    if: "github.event_name != 'pull_request'"
    needs: 'build'
    runs-on: 'ubuntu-latest'

    permissions:
      id-token: 'write'
      pages: 'write'

    environment:
      name: 'github-pages'
      url: '${{ steps.deploy.outputs.page_url }}'

    steps:
      - id: 'deploy'
        uses: 'actions/deploy-pages@v5'
